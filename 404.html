<style>
:root{--bg:#f2eee3;--ink:#15171a;--muted:#5c615a;--rule:#d6cfbd;--accent:#c2410c;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1210;--ink:#ecebe3;--muted:#9aa093;--rule:#2a302b;--accent:#ff8a57;--on-accent:#1b0e06}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;padding:24px}
main{max-width:560px;width:100%;border-top:1px solid var(--ink);padding-top:20px}
.k{font:600 12px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font:500 clamp(40px,9vw,64px)/1.02 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:-.025em;margin:14px 0 16px}
h1 em{color:var(--accent)}
p{color:var(--muted);margin:0 0 26px}
a.btn{display:inline-block;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;font-size:14px;padding:12px 16px;border-radius:5px}
a.btn:hover{filter:brightness(1.07)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
